---
# --- Wallpaper Download (Catppuccin Mocha + Arch Linux) ---
# Baixa um wallpaper oficial Catppuccin se não existir

- name: Ensure wallpapers directory exists
  file:
    path: "{{ target_home }}/.config/wallpapers"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags: [desktop, wallpaper]

- name: Check if custom arch wallpaper exists in repo
  stat:
    path: "{{ role_path }}/files/wallpapers/arch.png"
  register: repo_wallpaper
  tags: [desktop, wallpaper]

- name: Copy arch wallpaper from repo to expected config path
  copy:
    src: "{{ role_path }}/files/wallpapers/arch.png"
    dest: "{{ target_home }}/.config/wallpapers/wallpaper.png"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  when: repo_wallpaper.stat.exists and repo_wallpaper.stat.size > 1000
  tags: [desktop, wallpaper]

- name: Download Catppuccin Mocha wallpaper (fallback)
  get_url:
    url: "https://github.com/catppuccin/wallpapers/raw/main/gradient/mochaowo.png"
    dest: "{{ target_home }}/.config/wallpapers/wallpaper.png"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  when: not repo_wallpaper.stat.exists or repo_wallpaper.stat.size < 1000
  register: fallback_wallpaper
  ignore_errors: yes
  tags: [desktop, wallpaper]

- name: Download Arch Linux Catppuccin wallpaper (alternative if first failed)
  get_url:
    url: "https://raw.githubusercontent.com/catppuccin/wallpapers/main/misc/catppuccin_triangle.png"
    dest: "{{ target_home }}/.config/wallpapers/wallpaper.png"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  when:
    - (not repo_wallpaper.stat.exists or repo_wallpaper.stat.size < 1000)
    - fallback_wallpaper is failed
  ignore_errors: yes
  tags: [desktop, wallpaper]

# --- Garantir permissões corretas (fix para swww) ---
- name: Ensure .config directory has correct ownership (fix parent permissions)
  file:
    path: "{{ target_home }}/.config"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags: [desktop, wallpaper]

- name: Ensure wallpaper file has correct permissions for swww
  file:
    path: "{{ target_home }}/.config/wallpapers/wallpaper.png"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  ignore_errors: yes
  tags: [desktop, wallpaper]

- name: Verify wallpaper was deployed
  stat:
    path: "{{ target_home }}/.config/wallpapers/wallpaper.png"
  register: wallpaper_deployed
  tags: [desktop, wallpaper]

- name: Report wallpaper status
  debug:
    msg: >-
      {{ '✅ Wallpaper deployed successfully (' ~ wallpaper_deployed.stat.size ~ ' bytes)'
         if wallpaper_deployed.stat.exists
         else '❌ WARNING: Wallpaper NOT deployed! swww will show no background.' }}
