---
# --- Install Desktop Packages ---
- name: Install all desktop package groups
  pacman:
   name: "{{ item }}"
   state: present
  loop:
   - "{{ packages_hyprland | default([]) }}"
   - "{{ packages_theme | default([]) }}"
   - "{{ packages_terminal | default([]) }}"
  become: yes
  tags: [desktop, packages]

# --- SDDM Theme ---
- name: Ensure SDDM config directory exists
  file:
    path: /etc/sddm.conf.d
    state: directory
    mode: '0755'
  become: yes
  tags: [desktop, sddm]

- name: Check whether requested SDDM theme exists
  stat:
    path: "/usr/share/sddm/themes/{{ archdev_sddm_theme }}"
  register: archdev_sddm_theme_stat
  when:
    - archdev_sddm_theme | default('default') not in ['default', 'catppuccin-auto']
  tags: [desktop, sddm]

- name: Detect installed Catppuccin SDDM theme directory
  shell: 'for d in /usr/share/sddm/themes/catppuccin*; do [ -d "$d" ] && basename "$d" && exit 0; done; exit 1'
  args:
    executable: /bin/bash
  register: archdev_sddm_catppuccin_detect
  changed_when: false
  failed_when: false
  when: archdev_sddm_theme | default('default') == 'catppuccin-auto'
  tags: [desktop, sddm]

- name: Resolve SDDM theme name
  set_fact:
    archdev_sddm_theme_resolved: >-
      {{
        archdev_sddm_catppuccin_detect.stdout
        if archdev_sddm_theme | default('default') == 'catppuccin-auto'
        else archdev_sddm_theme
      }}
  tags: [desktop, sddm]

- name: Set SDDM Theme when requested theme exists
  copy:
    dest: /etc/sddm.conf.d/theme.conf
    content: |
      [Theme]
      Current={{ archdev_sddm_theme_resolved }}
  become: yes
  notify: Restart SDDM
  when:
    - archdev_sddm_theme_resolved | default('default') != 'default'
    - (
        (archdev_sddm_theme | default('default') == 'catppuccin-auto' and archdev_sddm_catppuccin_detect.rc == 0)
        or
        (archdev_sddm_theme | default('default') not in ['default', 'catppuccin-auto'] and archdev_sddm_theme_stat.stat.exists | default(false))
      )
  tags: [desktop, sddm]

- name: Remove SDDM theme override when using default theme
  file:
    path: /etc/sddm.conf.d/theme.conf
    state: absent
  become: yes
  notify: Restart SDDM
  when:
    - archdev_sddm_theme_resolved | default('default') == 'default'
      or not (
        (archdev_sddm_theme | default('default') == 'catppuccin-auto' and archdev_sddm_catppuccin_detect.rc == 0)
        or
        (archdev_sddm_theme | default('default') not in ['default', 'catppuccin-auto'] and archdev_sddm_theme_stat.stat.exists | default(false))
      )
  tags: [desktop, sddm]

- name: Ensure environment.d directory exists
  file:
    path: /etc/environment.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes
  tags: [desktop, gpu]

- name: Set dedicated AMD GPU as session priority
  copy:
    dest: /etc/environment.d/90-archdev-gpu.conf
    content: |
      WLR_DRM_DEVICES={{ primary_gpu_drm_path }}:{{ secondary_gpu_drm_path }}
      AQ_DRM_DEVICES={{ primary_gpu_drm_path }}:{{ secondary_gpu_drm_path }}
      DRI_PRIME=1
      LIBVA_DRIVER_NAME=radeonsi
      VDPAU_DRIVER=radeonsi
      AMD_VULKAN_ICD=RADV
      RADV_PERFTEST=gpl
      __GLX_VENDOR_LIBRARY_NAME=mesa
      GBM_BACKEND=amd-drm
    owner: root
    group: root
    mode: '0644'
  become: yes
  when:
    - archdev_enable_gpu_overrides | default(false) | bool
    - archdev_graphics_mode | default('generic') == 'amd'
    - primary_gpu_drm_path | default('') | length > 0
    - secondary_gpu_drm_path | default('') | length > 0
  tags: [desktop, gpu]

- name: Remove GPU override environment when not needed
  file:
    path: /etc/environment.d/90-archdev-gpu.conf
    state: absent
  become: yes
  when: not (archdev_enable_gpu_overrides | default(false) | bool and archdev_graphics_mode | default('generic') == 'amd')
  tags: [desktop, gpu]

- name: Set safe virtual graphics environment for Hyprland
  copy:
    dest: /etc/environment.d/91-archdev-virtual-gpu.conf
    content: |
      LIBGL_ALWAYS_SOFTWARE=1
      WLR_RENDERER_ALLOW_SOFTWARE=1
      WLR_RENDERER=pixman
      WLR_NO_HARDWARE_CURSORS=1
    owner: root
    group: root
    mode: '0644'
  become: yes
  when: archdev_graphics_mode | default('generic') in ['vmware', 'virtualbox', 'kvm']
  tags: [desktop, gpu]

- name: Remove virtual graphics environment when not needed
  file:
    path: /etc/environment.d/91-archdev-virtual-gpu.conf
    state: absent
  become: yes
  when: archdev_graphics_mode | default('generic') not in ['vmware', 'virtualbox', 'kvm']
  tags: [desktop, gpu]

# NOTA: Firefox profile e user.js configurados em assets.yml

- include_tasks: assets.yml
  tags: [desktop, assets, wallpaper]

- name: Enable display manager (SDDM)
  systemd:
   name: sddm
   enabled: yes
   state: started
