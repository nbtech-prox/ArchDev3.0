---
- name: Ensure Node.js and npm are installed for OpenCode
  pacman:
    name:
      - nodejs
      - npm
    state: present
  become: yes
  tags: [dev, tools, opencode]

- name: Check if OpenCode is already installed globally
  command: command -v opencode
  register: opencode_installed
  changed_when: false
  failed_when: false
  tags: [dev, tools, opencode]

- name: Install OpenCode globally with npm
  command: npm i -g {{ archdev_feature_opencode_package }}
  become: yes
  when: opencode_installed.rc != 0
  tags: [dev, tools, opencode]
