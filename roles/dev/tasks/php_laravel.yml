---
# --- ASDF Setup for PHP Version Management ---
# Permite usar 'bubble l' para criar ambientes PHP isolados com versões específicas
- name: Install ASDF PHP plugin
  shell: |
    . /opt/asdf-vm/asdf.sh
    asdf plugin add php https://github.com/asdf-community/asdf-php.git || true
  args:
    executable: /bin/bash
  ignore_errors: yes
  tags: [dev, php, asdf]

- name: Ensure ASDF shims are in PATH for subsequent tasks
  lineinfile:
    path: "{{ target_home }}/.zshenv"
    line: 'export PATH="${ASDF_DATA_DIR:-$HOME/.asdf}/shims:$PATH"'
    create: yes
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  ignore_errors: yes
  tags: [dev, php, asdf]

- name: Set PHP timezone
  lineinfile:
    path: /etc/php/php.ini
    regexp: ';date.timezone ='
    line: 'date.timezone = UTC'
  tags: [dev, php]

# --- Enable Extensions ---
- name: Enable PHP extensions
  lineinfile:
    path: /etc/php/php.ini
    regexp: ';extension={{ item }}'
    line: 'extension={{ item }}'
  loop:
    - bcmath
    - intl
    - pdo_pgsql
    - pgsql
    - sqlite3
    - curl
    - iconv
    - zip
    - gd
    - bz2
    - exif
    - ftp
    - gettext
  notify: Restart PHP-FPM
  tags: [dev, php, extensions]

- name: Remove invalid built-in PHP extension directives
  lineinfile:
    path: /etc/php/php.ini
    regexp: '^extension={{ item }}$'
    state: absent
  loop:
    - openssl
    - fileinfo
    - mbstring
  notify: Restart PHP-FPM
  tags: [dev, php, extensions]

# --- PHP Development Configuration ---
- name: Configure PHP for Development (Laravel Optimized)
  lineinfile:
    path: /etc/php/php.ini
    regexp: '{{ item.regexp }}'
    line: '{{ item.line }}'
  loop:
    # Memory
    - { regexp: '^memory_limit\s*=.*', line: 'memory_limit = 512M' }
    # File Uploads
    - { regexp: '^upload_max_filesize\s*=.*', line: 'upload_max_filesize = 128M' }
    - { regexp: '^post_max_size\s*=.*', line: 'post_max_size = 128M' }
    - { regexp: '^max_file_uploads\s*=.*', line: 'max_file_uploads = 20' }
    # Execution
    - { regexp: '^max_execution_time\s*=.*', line: 'max_execution_time = 300' }
    - { regexp: '^max_input_time\s*=.*', line: 'max_input_time = 300' }
    - { regexp: '^max_input_vars\s*=.*', line: 'max_input_vars = 5000' }
    # Error Reporting (Development)
    - { regexp: '^error_reporting\s*=.*', line: 'error_reporting = E_ALL' }
    - { regexp: '^display_errors\s*=.*', line: 'display_errors = On' }
    - { regexp: '^display_startup_errors\s*=.*', line: 'display_startup_errors = On' }
    - { regexp: '^log_errors\s*=.*', line: 'log_errors = On' }
    # OPcache (Performance)
    - { regexp: '^;opcache.enable\s*=.*', line: 'opcache.enable = 1' }
    - { regexp: '^;opcache.memory_consumption\s*=.*', line: 'opcache.memory_consumption = 256' }
    - { regexp: '^;opcache.max_accelerated_files\s*=.*', line: 'opcache.max_accelerated_files = 20000' }
    - { regexp: '^;opcache.revalidate_freq\s*=.*', line: 'opcache.revalidate_freq = 0' }
    - { regexp: '^;opcache.validate_timestamps\s*=.*', line: 'opcache.validate_timestamps = 1' }
    # Realpath Cache
    - { regexp: '^;realpath_cache_size\s*=.*', line: 'realpath_cache_size = 4096K' }
    - { regexp: '^;realpath_cache_ttl\s*=.*', line: 'realpath_cache_ttl = 600' }
  notify: Restart PHP-FPM
  tags: [dev, php, config]

# --------------------------------------------------------
# PHP Opcache (Development Optimized)
# --------------------------------------------------------

- name: Configure PHP opcache for dev
  copy:
    src: 99-opcache-dev.ini
    dest: /etc/php/conf.d/99-opcache-dev.ini
    owner: root
    group: root
    mode: '0644'
  become: yes
  tags: [dev, php]

# --- Composer ---
- name: Install Composer globally
  get_url:
    url: https://getcomposer.org/composer-stable.phar
    dest: /usr/local/bin/composer
    mode: '0755'
  tags: [dev, php, composer]

- name: Initialize PostgreSQL data directory
  command: initdb -D /var/lib/postgres/data --locale=C.UTF-8 --encoding=UTF8
  args:
    creates: /var/lib/postgres/data/PG_VERSION
  become: yes
  become_user: postgres
  tags: [dev, postgresql]

- name: Configure PostgreSQL listen address
  lineinfile:
    path: /var/lib/postgres/data/postgresql.conf
    regexp: '^#?listen_addresses\s*=.*'
    line: "listen_addresses = 'localhost'"
  notify: Restart PostgreSQL
  tags: [dev, postgresql]

- name: Configure PostgreSQL password encryption
  lineinfile:
    path: /var/lib/postgres/data/postgresql.conf
    regexp: '^#?password_encryption\s*=.*'
    line: "password_encryption = 'scram-sha-256'"
  notify: Restart PostgreSQL
  tags: [dev, postgresql]

- name: Configure PostgreSQL for workstation development
  lineinfile:
    path: /var/lib/postgres/data/postgresql.conf
    regexp: '^#?{{ item.key }}\s*=.*'
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: shared_buffers, value: "'8GB'" }
    - { key: effective_cache_size, value: "'24GB'" }
    - { key: work_mem, value: "'32MB'" }
    - { key: maintenance_work_mem, value: "'1GB'" }
    - { key: wal_buffers, value: "'32MB'" }
    - { key: effective_io_concurrency, value: '256' }
    - { key: random_page_cost, value: '1.1' }
    - { key: default_statistics_target, value: '200' }
    - { key: max_connections, value: '200' }
  notify: Restart PostgreSQL
  tags: [dev, postgresql]

- name: Ensure PostgreSQL local auth rules are present
  blockinfile:
    path: /var/lib/postgres/data/pg_hba.conf
    marker: "# {mark} ARCHDEV POSTGRESQL"
    block: |
      local   all             all                                     scram-sha-256
      host    all             all             127.0.0.1/32            scram-sha-256
      host    all             all             ::1/128                 scram-sha-256
  notify: Restart PostgreSQL
  tags: [dev, postgresql]

- name: Start and enable PostgreSQL service
  systemd:
    name: postgresql
    enabled: yes
    state: started
  tags: [dev, postgresql]

# --- Apache ---

- name: Enable MPM Prefork (Required for mod_php)
  replace:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^LoadModule mpm_event_module'
    replace: '#LoadModule mpm_event_module'
  tags: [dev, apache]

- name: Ensure MPM Prefork is loaded
  replace:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^#LoadModule mpm_prefork_module'
    replace: 'LoadModule mpm_prefork_module'
  notify: Restart Apache
  tags: [dev, apache]

- name: Load PHP module in Apache (mod_php)
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    line: "LoadModule php_module modules/libphp.so"
    insertafter: '^LoadModule'
    state: present
  notify: Restart Apache
  tags: [dev, apache, php]

- name: Add PHP handler in Apache
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    line: "AddHandler php-script .php"
    insertafter: 'LoadModule php_module'
    state: present
  notify: Restart Apache
  tags: [dev, apache, php]

- name: Start and enable Apache service
  systemd:
    name: httpd
    enabled: yes
    state: started
  tags: [dev, apache]
