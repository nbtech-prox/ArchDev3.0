---
# --------------------------------------------------------
# Install Development Packages
# --------------------------------------------------------

- name: Install Developer Tools
  pacman:
    name: "{{ packages_dev_tools + (packages_dev_tools_full if archdev_enable_full | bool else []) }}"
    state: present
  become: yes
  tags: [dev, tools]

- name: Install Web Dev Stack (PHP/Laravel)
  pacman:
    name: "{{ packages_dev_web }}"
    state: present
  become: yes
  tags: [dev, web]

- name: Install Python Stack
  pacman:
    name: "{{ packages_dev_python }}"
    state: present
  become: yes
  tags: [dev, python]

- name: Check if OpenCode is already installed globally
  command: npm list -g --depth=0 opencode-ai
  register: opencode_installed
  changed_when: false
  failed_when: false
  tags: [dev, tools, opencode]

- name: Install OpenCode globally with npm
  command: npm i -g opencode-ai
  become: yes
  when: opencode_installed.rc != 0
  tags: [dev, tools, opencode]

- name: Ensure Composer home directory exists
  file:
    path: "{{ target_home }}/.config/composer"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags: [dev, tools, laravel]

- name: Install Laravel installer globally with Composer
  command: composer global require laravel/installer --no-interaction --prefer-dist
  args:
    creates: "{{ target_home }}/.config/composer/vendor/bin/laravel"
  become: yes
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_home }}"
    COMPOSER_HOME: "{{ target_home }}/.config/composer"
  tags: [dev, tools, laravel]

# --------------------------------------------------------
# Docker Setup
# --------------------------------------------------------

- name: Add user to Docker group
  user:
    name: "{{ target_user }}"
    groups: docker
    append: yes
  become: yes
  tags: [dev, docker]

- name: Enable Docker Service
  systemd:
    name: docker
    enabled: yes
    state: started
  become: yes
  tags: [dev, docker]

- include_tasks: docker_helper.yml
  tags: [dev, docker]

# --------------------------------------------------------
# Include Subtasks
# --------------------------------------------------------

- include_tasks: php_laravel.yml
  tags: [dev, web]

- include_tasks: python.yml
  tags: [dev, python]

- include_tasks: docker_tuning.yml
  tags: [dev, docker]

- include_tasks: git_autosync.yml
  tags: [dev, git-autosync]

- name: Enable Redis service for full workstation profile
  systemd:
    name: redis
    enabled: yes
    state: started
  become: yes
  when: archdev_enable_full | bool
  tags: [dev, redis]


# --------------------------------------------------------
# Helpers Directory Structure
# --------------------------------------------------------

- name: Ensure helpers directory exists
  file:
    path: "{{ target_home }}/.config/helpers"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags: [dev, helpers]

- name: Install helpers README
  copy:
    src: helpers-readme.txt
    dest: "{{ target_home }}/.config/helpers/README.txt"
    mode: '0644'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  tags: [dev, helpers]

# --------------------------------------------------------
# Bitwarden Setup (substitui pass)
# --------------------------------------------------------

- name: Install Bitwarden setup helper
  copy:
    src: bitwarden-setup.sh
    dest: "{{ target_home }}/.config/helpers/bitwarden-setup.sh"
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  tags: [dev, bitwarden, helpers]

- name: Create symlink for bitwarden helper
  file:
    src: "{{ target_home }}/.config/helpers/bitwarden-setup.sh"
    dest: /usr/local/bin/archdev-bitwarden-setup
    state: link
    force: yes
  become: yes
  tags: [dev, bitwarden, helpers]

- name: Create Bitwarden notice
  copy:
    content: |
      ================================================
      🔐 BITWARDEN PASSWORD MANAGER
      ================================================
      
      O rbw e rofi-rbw estão instalados.
      
      Para configurar:
         archdev-bitwarden-setup
         
      Ou diretamente:
         ~/.config/helpers/bitwarden-setup.sh
      
      Comandos úteis:
         rbw login          # Fazer login
         rbw sync           # Sincronizar vault
         rofi-rbw           # Interface gráfica (Super+P)
         
      Atalho: Super+P → Abrir seletor de passwords
      
      ================================================
    dest: "{{ target_home }}/.config/helpers/bitwarden-notice.txt"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  tags: [dev, bitwarden, helpers]

# --------------------------------------------------------
# Security & Helper Scripts
# --------------------------------------------------------

- name: Install backup keys helper script
  copy:
    src: backup-keys.sh
    dest: "{{ target_home }}/.config/helpers/backup-keys.sh"
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  tags: [dev, security, helpers]

- name: Create symlink for backup-keys helper
  file:
    src: "{{ target_home }}/.config/helpers/backup-keys.sh"
    dest: /usr/local/bin/archdev-backup-keys
    state: link
    force: yes
  become: yes
  tags: [dev, security, helpers]

- name: Install GPU status helper script
  copy:
    src: gpu-status.sh
    dest: "{{ target_home }}/.config/helpers/gpu-status.sh"
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  tags: [dev, gpu, helpers]

- name: Create symlink for GPU status helper
  file:
    src: "{{ target_home }}/.config/helpers/gpu-status.sh"
    dest: /usr/local/bin/archdev-gpu-status
    state: link
    force: yes
  become: yes
  tags: [dev, gpu, helpers]

# --------------------------------------------------------
# PostgreSQL Setup (service enable/start está em php_laravel.yml)
# --------------------------------------------------------

- name: Install PostgreSQL setup helper
  copy:
    src: postgresql-setup.sh
    dest: "{{ target_home }}/.config/helpers/postgresql-setup.sh"
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  tags: [dev, postgresql, helpers]

- name: Create symlink for PostgreSQL helper
  file:
    src: "{{ target_home }}/.config/helpers/postgresql-setup.sh"
    dest: /usr/local/bin/archdev-postgresql-setup
    state: link
    force: yes
  become: yes
  tags: [dev, postgresql, helpers]

