---
- name: Check if yay is installed
  command: which yay
  register: yay_check
  changed_when: false
  failed_when: false
  tags: [aur, yay]

- name: Remove old yay build directory
  file:
    path: /tmp/yay
    state: absent
  when: yay_check.rc != 0

- name: Clone yay repository
  git:
    repo: https://aur.archlinux.org/yay.git
    dest: /tmp/yay
  become: false
  when: yay_check.rc != 0
  tags: [aur, yay]

- name: Build yay package
  command: makepkg -s --noconfirm --needed
  args:
    chdir: /tmp/yay
  become: false
  when: yay_check.rc != 0
  tags: [aur, yay]

- name: Install built yay package
  become: true
  shell: pacman -U --noconfirm /tmp/yay/yay-*.pkg.tar.zst
  args:
    executable: /bin/bash
  when: yay_check.rc != 0
  tags: [aur, yay]

- name: Remove yay build directory
  file:
    path: /tmp/yay
    state: absent
  when: yay_check.rc != 0
  tags: [aur, yay]

- name: Create temporary NOPASSWD sudoers for pacman (required by yay)
  copy:
    content: "{{ target_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    dest: /etc/sudoers.d/99-archdev-aur-temp
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  become: true
  tags: [aur, packages]

- name: Define AUR packages lists
  set_fact:
    aur_essential:
      - wlogout
      - awww
      - hyprpicker
      - asdf-vm
      - antigravity
      - catppuccin-gtk-theme-mocha
      - catppuccin-cursors-mocha
      - catppuccin-sddm-theme-mocha
      - kvantum-theme-catppuccin-git
    aur_optional:
      - nwg-look
      - bibata-cursor-theme
      - btrfs-assistant
      - limine-snapper-sync-git
      - waypaper
      - imv
  tags: [aur, packages]

- name: Check AUR package availability (essential)
  shell: yay -Si {{ item }} &>/dev/null && echo "exists" || echo "missing"
  loop: "{{ aur_essential }}"
  register: aur_check_essential
  changed_when: false
  failed_when: false
  become: false
  tags: [aur, packages]

- name: Check AUR package availability (optional)
  shell: yay -Si {{ item }} &>/dev/null && echo "exists" || echo "missing"
  loop: "{{ aur_optional }}"
  register: aur_check_optional
  changed_when: false
  failed_when: false
  become: false
  tags: [aur, packages]

- name: Install essential AUR packages
  shell: |
    yay -S --noconfirm --needed --answerdiff None --answerclean None {{ item.item }} 2>&1 || \
    (sleep 5 && yay -S --noconfirm --needed --answerdiff None --answerclean None {{ item.item }} 2>&1)
  loop: "{{ aur_check_essential.results }}"
  when: item.stdout == "exists"
  become: false
  register: aur_essential_install
  failed_when: aur_essential_install.rc != 0
  ignore_errors: true
  tags: [aur, packages]

- name: Install optional AUR packages
  shell: |
    yay -S --noconfirm --needed --answerdiff None --answerclean None {{ item.item }} 2>&1 || \
    (sleep 5 && yay -S --noconfirm --needed --answerdiff None --answerclean None {{ item.item }} 2>&1)
  loop: "{{ aur_check_optional.results }}"
  when:
    - feature_full | default(false) | bool
    - item.stdout == "exists"
  become: false
  register: aur_optional_install
  failed_when: false
  tags: [aur, packages]

- name: Remove temporary NOPASSWD sudoers (security cleanup)
  file:
    path: /etc/sudoers.d/99-archdev-aur-temp
    state: absent
  become: true
  tags: [aur, packages]

- name: Ensure archdev config directory exists
  file:
    path: "{{ target_home }}/.config/archdev"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags: [aur, packages]

- name: Create AUR status file
  copy:
    content: |
      ==========================================
      AUR PACKAGES STATUS
      ==========================================

      ESSENTIALS:
      {% for pkg in aur_check_essential.results %}
      {% if pkg.stdout == "exists" %}  ✓ {{ pkg.item }}{% else %}  ✗ {{ pkg.item }} (não encontrado){% endif %}
      {% endfor %}

      OPTIONALS:
      {% for pkg in aur_check_optional.results %}
      {% if pkg.stdout == "exists" %}  ✓ {{ pkg.item }}{% else %}  ✗ {{ pkg.item }} (não encontrado){% endif %}
      {% endfor %}

      ==========================================
    dest: "{{ target_home }}/.config/archdev/aur-status.txt"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  tags: [aur, packages]
