---
# --- Configure ZSH (instalado no role desktop) ---
- name: Configure Zsh as default shell
  user:
    name: "{{ target_user }}"
    shell: /usr/bin/zsh
  tags: [dotfiles, shell]

# --- Dotfiles Configuration ---
- name: Ensure .config directory exists
  file:
    path: "{{ target_home }}/.config"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags: [dotfiles, setup]

- name: Create local bin directory
  file:
    path: "{{ target_home }}/.local/bin"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags: [dotfiles, setup]

# --- GPU Detection for Hyprland ---
- name: Detect GPU vendor
  shell: |
    if lspci | grep -i 'vga\|3d\|display' | grep -qi 'amd\|ati\|radeon'; then
      echo "amd"
    elif lspci | grep -i 'vga\|3d\|display' | grep -qi 'intel'; then
      echo "intel"
    elif lspci | grep -i 'vga\|3d\|display' | grep -qi 'nvidia'; then
      echo "nvidia"
    else
      echo "generic"
    fi
  register: gpu_detect
  changed_when: false
  tags: [dotfiles, config, hypr]

- name: Set GPU vendor fact
  set_fact:
    gpu_vendor: "{{ gpu_detect.stdout }}"
  tags: [dotfiles, config, hypr]

# --- Hyprland Config (Template with GPU detection) ---
- name: Ensure Hypr directory exists
  file:
    path: "{{ target_home }}/.config/hypr"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags: [dotfiles, config, hypr]

- name: Deploy Hyprland config (GPU-aware)
  template:
    src: hyprland.conf.j2
    dest: "{{ target_home }}/.config/hypr/hyprland.conf"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  tags: [dotfiles, config, hypr]

- name: Copy Hyprland auxiliary configs (hypridle, hyprlock)
  copy:
    src: "{{ role_path }}/files/hypr/{{ item }}"
    dest: "{{ target_home }}/.config/hypr/{{ item }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  loop:
    - hypridle.conf
    - hyprlock.conf
  tags: [dotfiles, config, hypr]

- name: Ensure Hyprland scripts directory exists
  file:
    path: "{{ target_home }}/.config/hypr/scripts"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags: [dotfiles, config, hypr]

- name: Copy Hyprland scripts
  copy:
    src: "{{ role_path }}/files/hypr/scripts/"
    dest: "{{ target_home }}/.config/hypr/scripts/"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
    directory_mode: '0755'
  tags: [dotfiles, config, hypr]

# --- Other Configs ---
- name: Copy Configuration Directories (Waybar, Kitty, etc.)
  copy:
    src: "{{ role_path }}/files/{{ item }}/"
    dest: "{{ target_home }}/.config/{{ item }}/"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
    directory_mode: '0755'
  loop:
    - waybar
    - kitty
    - dunst
    - rofi
    - wlogout
    - nvim
    - zathura
  tags: [dotfiles, config]

- name: Deploy Starship config to root of .config
  copy:
    src: starship/starship.toml
    dest: "{{ target_home }}/.config/starship.toml"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  tags: [dotfiles, config, shell]

- name: Ensure Waybar scripts are executable
  file:
    path: "{{ target_home }}/.config/waybar/scripts"
    state: directory
    recurse: yes
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  tags: [dotfiles, config]

- name: Copy Zsh Configuration
  copy:
    src: "{{ role_path }}/files/zsh/"
    dest: "{{ target_home }}/.config/zsh/"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
    directory_mode: '0755'
  tags: [dotfiles, zsh]

- name: Link .zshrc
  file:
    src: "{{ target_home }}/.config/zsh/.zshrc"
    dest: "{{ target_home }}/.zshrc"
    state: link
    force: yes
  become: no
  tags: [dotfiles, zsh]

- name: Ensure theme config directories exist
  file:
    path: "{{ target_home }}/.config/{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  loop:
    - gtk-3.0
    - gtk-4.0
    - qt5ct
    - qt6ct
    - Kvantum
  tags: [dotfiles, theme]

- name: Deploy GTK3 config
  copy:
    src: gtk-3.0/settings.ini
    dest: "{{ target_home }}/.config/gtk-3.0/settings.ini"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: no
  tags: [dotfiles, theme]

- name: Deploy GTK4 config
  copy:
    src: gtk-4.0/settings.ini
    dest: "{{ target_home }}/.config/gtk-4.0/settings.ini"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: no
  tags: [dotfiles, theme]

- name: Deploy qt5ct config
  copy:
    src: qt5ct/qt5ct.conf
    dest: "{{ target_home }}/.config/qt5ct/qt5ct.conf"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: no
  tags: [dotfiles, theme]

- name: Deploy qt6ct config
  copy:
    src: qt6ct/qt6ct.conf
    dest: "{{ target_home }}/.config/qt6ct/qt6ct.conf"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: no
  tags: [dotfiles, theme]

- name: Deploy Kvantum config
  copy:
    src: Kvantum/kvantum.kvconfig
    dest: "{{ target_home }}/.config/Kvantum/kvantum.kvconfig"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: no
  tags: [dotfiles, theme]
