---
# ============================================
# 1. INSTALL - Pacotes base e sistema
# ============================================

- name: Update system packages (Arch Linux)
  pacman:
    update_cache: yes
    upgrade: yes
  tags: [system, update]

- name: Install base system utilities
  pacman:
    name: "{{ packages_system + packages_admin }}"
    state: present
  tags: [system, base]

# ============================================
# 2. SERVICES - Ativar serviços essenciais
# ============================================
# Nota: Os pacotes já estão instalados acima (ufw, openssh, etc.)

- name: Enable essential services
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - ufw
    - sshd
    - NetworkManager
    - bluetooth
  ignore_errors: true
  tags: [system, services]

# ============================================
# 3. FIREWALL - Configurar UFW (já instalado)
# ============================================

- name: Configure UFW Defaults
  ufw:
    state: enabled
    policy: deny
    direction: incoming
  become: yes
  tags: [system, firewall]

- name: Allow Outgoing UFW
  ufw:
    state: enabled
    policy: allow
    direction: outgoing
  become: yes
  tags: [system, firewall]

- name: Allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp
  become: yes
  tags: [system, firewall]

- name: Allow Dev Ports
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - '8000' # Laravel
    - '8080' # Node
    - '5000' # Flask
    - '8550' # Flet
  become: yes
  tags: [system, firewall]

# ============================================
# 4. AUR - Yay e pacotes AUR
# ============================================

- include_tasks: aur.yml
  tags: [aur]

# ============================================
# 5. SECURITY - Fail2ban e hardening
# ============================================

- name: Configure Fail2ban for SSH protection
  copy:
    src: fail2ban-ssh.conf
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  notify: Restart Fail2ban
  tags: [security, fail2ban]

- name: Enable and start Fail2ban
  systemd:
    name: fail2ban
    enabled: yes
    state: started
  tags: [security, fail2ban]

- name: Ensure security directory exists
  file:
   path: /etc/system-hardening
   state: directory
   mode: '0755'
  become: true

- name: Create security audit notice
  copy:
    content: |
      ================================================
      🛡️  SEGURANÇA DO SISTEMA - RESUMO
      ================================================
      
      Proteções Ativas:
      
      1. Firewall (UFW)
         - Bloqueia conexões de entrada
         - Permite apenas SSH (porta 22)
         - Portas dev abertas: 8000, 8080, 5000, 8550
      
      2. Fail2ban
         - Protege SSH contra brute force
         - Bloqueia IP após 3 tentativas falhadas
         - BAN dura 1 hora
      
      3. Btrfs + Snapper
         - Snapshots automáticos
         - Rollback no boot (Limine)
         - 3 snapshots mantidos
      
      4. Password Manager (pass)
         - Passwords cifradas com GPG
         - Integrado com rofi (Super+P)
      
      Comandos Úteis:
         sudo ufw status              # Ver firewall
         sudo fail2ban-client status  # Ver fail2ban
         sudo lynis audit system      # Auditoria completa
         archdev-backup-keys          # Backup chaves (em ~/.config/helpers/)
      
      ================================================
    dest: /etc/system-hardening/security-notice.txt
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: true
  tags: [security]
