  - snapper
  - snap-pac
  - ufw
  - openssh
  - fail2ban  
  - lynis     

# --- Diretórios ---
projects_dir: "/mnt/projetos"

# --- Configuração do Sistema ---
keyboard_layout: "pt"

# --- GPU Principal ---
# Defaults seguros. Para a 4.0, sobrepor por máquina em inventories/host_vars/<hostname>.yml
archdev_hardware_type: "baremetal"
archdev_cpu_vendor: "generic"
archdev_graphics_mode: "generic"
archdev_enable_gpu_overrides: false
archdev_enable_wlsunset: true
archdev_sddm_theme: "catppuccin-auto"
primary_gpu_drm_path: ""
secondary_gpu_drm_path: ""

# --- Hardware alvo ---
# Defaults globais. Afinar por máquina em inventories/host_vars/<hostname>.yml
archdev_target_ram_mb: 65536
archdev_enable_zram: true

# --- Night Mode (wlsunset) ---
# Defaults globais. Afinar por máquina em inventories/host_vars/<hostname>.yml
wlsunset_latitude: "38.7"
wlsunset_longitude: "-9.1"
